set-environment -gF SE_WORKFLOW_SCRIPTS '#{d:current_file}'

bind-key A display-popup -E -w 80% -h 80% -d '#{pane_current_path}' '"${SE_WORKFLOW_SCRIPTS:-$HOME/se-workflow/scripts}/dashboard"'
